<div style="min-height: 100vh; background-color: #0f172a; display: flex; align-items: center; justify-content: center; padding: 1rem; font-family: system-ui, sans-serif;">
  <div style="max-width: 28rem; width: 100%; background-color: #ffffff; border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">

    <!-- Encabezado e Icono de la Clínica -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="width: 64px; height: 64px; background-color: #e0f2fe; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
        <!-- SVG con tamaño fijo garantizado -->
        <svg style="width: 40px; height: 40px; color: #0284c7;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin: 0;">Sistema Clínico</h2>
      <p style="font-size: 0.875rem; color: #64748b; margin-top: 0.25rem;">Plataforma de Gestión Médica</p>
    </div>

    <!-- Mensaje de Error -->
    <div *ngIf="errorMessage" style="background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 0.75rem; border-radius: 0.5rem; color: #b91c1c; font-size: 0.875rem; margin-bottom: 1rem;">
      {{ errorMessage }}
    </div>

    <!-- Formulario de Login -->
    <form (ngSubmit)="login()" style="display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #334155; margin-bottom: 0.25rem;">Nombre de Usuario</label>
        <input type="text"
               [(ngModel)]="nombreUsuario"
               name="nombreUsuario"
               required
               placeholder="Ej: admin"
               style="width: 100%; padding: 0.625rem 1rem; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 0.75rem; outline: none; box-sizing: border-box;" />
      </div>

      <div>
        <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #334155; margin-bottom: 0.25rem;">Contraseña</label>
        <input type="password"
               [(ngModel)]="clave"
               name="clave"
               required
               placeholder="••••••••"
               style="width: 100%; padding: 0.625rem 1rem; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 0.75rem; outline: none; box-sizing: border-box;" />
      </div>

      <button type="submit"
              [disabled]="isLoading"
              style="width: 100%; background-color: #0284c7; color: #ffffff; font-weight: 500; padding: 0.75rem; border-radius: 0.75rem; border: none; cursor: pointer; transition: background-color 0.2s;"
              [style.opacity]="isLoading ? '0.5' : '1'">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading">Cargando...</span>
      </button>
    </form>

  </div>
</div>
